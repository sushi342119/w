<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="skybg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc062"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <linearGradient id="brickFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e24a1e"/>
      <stop offset="1" stop-color="#a02808"/>
    </linearGradient>
    <linearGradient id="helmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe458"/>
      <stop offset="1" stop-color="#eaa800"/>
    </linearGradient>
    <filter id="drop3" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4a1500" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#skybg)"/>

  <!-- 太阳 -->
  <circle cx="148" cy="42" r="14" fill="#fff6c2" opacity="0.7"/>

  <!-- 底部地面线 -->
  <rect x="0" y="160" width="192" height="32" fill="#c13d0a" opacity="0.6"/>

  <!-- 头身体：圆脸小人 -->
  <g filter="url(#drop3)">
    <!-- 安全帽 -->
    <path d="M 60,72 Q 60,48 96,48 Q 132,48 132,72 L 138,72 Q 138,76 132,76 L 60,76 Q 54,76 54,72 Z" fill="url(#helmet)"/>
    <!-- 帽子上的条纹 -->
    <line x1="96" y1="48" x2="96" y2="72" stroke="#b88800" stroke-width="1.5" opacity="0.6"/>
    <!-- 脸 -->
    <ellipse cx="96" cy="92" rx="26" ry="22" fill="#ffddb0"/>
    <!-- 眼睛（^_^ 开心） -->
    <path d="M 85,88 Q 88,83 91,88" stroke="#3a1f00" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 101,88 Q 104,83 107,88" stroke="#3a1f00" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- 嘴巴微笑 -->
    <path d="M 88,100 Q 96,106 104,100" stroke="#3a1f00" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- 腮红 -->
    <circle cx="78" cy="96" r="3" fill="#ff9999" opacity="0.7"/>
    <circle cx="114" cy="96" r="3" fill="#ff9999" opacity="0.7"/>
  </g>

  <!-- 头顶扛的砖 -->
  <g filter="url(#drop3)">
    <!-- 砖块（稍倾斜，显得在扛） -->
    <g transform="rotate(-6 96 36)">
      <rect x="56" y="26" width="80" height="22" rx="2" fill="url(#brickFace)"/>
      <rect x="56" y="26" width="80" height="22" rx="2" fill="none" stroke="#7a2000" stroke-width="1" opacity="0.7"/>
      <line x1="82" y1="26" x2="82" y2="48" stroke="#7a2000" stroke-width="1" opacity="0.6"/>
      <line x1="110" y1="26" x2="110" y2="48" stroke="#7a2000" stroke-width="1" opacity="0.6"/>
      <!-- 砖上的小¥ -->
      <text x="96" y="43" text-anchor="middle" font-size="14" font-weight="900" fill="#ffd98a" font-family="Arial Black,sans-serif">¥</text>
    </g>
  </g>

  <!-- 身体（简化成一抹） -->
  <g filter="url(#drop3)">
    <path d="M 72,114 Q 72,160 96,160 Q 120,160 120,114 Z" fill="#3a7dc9"/>
    <!-- 衣服中线 -->
    <line x1="96" y1="118" x2="96" y2="155" stroke="#1e4d82" stroke-width="1.2" opacity="0.5"/>
    <!-- 纽扣 -->
    <circle cx="96" cy="128" r="1.8" fill="#ffe458"/>
    <circle cx="96" cy="138" r="1.8" fill="#ffe458"/>
  </g>
</svg>
